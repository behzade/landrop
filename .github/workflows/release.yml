name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
            outfile: build/landrop-linux-x64
            asset: landrop-linux-x64
          - name: linux-arm64
            target: bun-linux-arm64
            outfile: build/landrop-linux-arm64
            asset: landrop-linux-arm64
          - name: macos-x64
            target: bun-darwin-x64
            outfile: build/landrop-darwin-x64
            asset: landrop-darwin-x64
          - name: macos-arm64
            target: bun-darwin-arm64
            outfile: build/landrop-darwin-arm64
            asset: landrop-darwin-arm64
          - name: windows-x64
            target: bun-windows-x64
            outfile: build/landrop-windows-x64.exe
            asset: landrop-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build executable
        run: bun run build:prod -- --target=${{ matrix.target }} --outfile=${{ matrix.outfile }}

      - name: Prepare release asset
        run: |
          chmod +x "${{ matrix.outfile }}"
          cp "${{ matrix.outfile }}" "${{ matrix.asset }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
